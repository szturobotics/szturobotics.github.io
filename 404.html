<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#05090f" />
    <script>
      (() => {
        const host = window.location.hostname.toLowerCase();
        if (host === "originmindos.cn" || host.endsWith(".originmindos.cn")) {
          window.location.replace("/errors/zh/");
        }
      })();
    </script>
    <title>Page not found｜OriginMind OS</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f5f9fb;
        background: #05090f;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          "PingFang SC",
          sans-serif;
      }
      main {
        width: min(100%, 680px);
        padding: 70px 40px;
        border: 1px solid rgba(150, 190, 216, 0.17);
        border-radius: 16px;
        text-align: center;
        background:
          radial-gradient(
            circle at 50% 10%,
            rgba(75, 220, 255, 0.12),
            transparent 45%
          ),
          #07121d;
      }
      small {
        color: #4bdcff;
        font:
          700 11px ui-monospace,
          monospace;
        letter-spacing: 0.16em;
      }
      h1 {
        margin: 15px 0 8px;
        font-size: clamp(52px, 12vw, 96px);
        line-height: 1;
      }
      p {
        margin: 0 0 32px;
        color: #a8bac7;
        font-size: 17px;
      }
      a {
        display: inline-flex;
        min-height: 50px;
        align-items: center;
        padding: 0 22px;
        border-radius: 8px;
        color: #031119;
        background: #4bdcff;
        font-weight: 750;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <small>ORIGINMIND / PAGE NOT FOUND</small>
      <h1>404</h1>
      <p>The page you requested does not exist or has moved.</p>
      <a href="https://www.originmindos.com/">Return to OriginMind</a>
    </main>
  </body>
</html>
